name: release

# Cut a release by pushing a tag, e.g.  git tag v0.1.0 && git push origin v0.1.0
# Only maintainers can push tags, so only maintainers can change what grcskills.io shows.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate
        run: python3 scripts/sync_references.py --check
      - name: Build catalog.json
        run: python3 scripts/build_catalog.py --version "${GITHUB_REF_NAME}" --out dist/catalog.json
      - name: Publish GitHub release with catalog.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Works whether the tag was pushed from git or created by drafting a release in the GitHub UI.
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" --title "GRC Skills ${GITHUB_REF_NAME}" --generate-notes --verify-tag
          gh release upload "${GITHUB_REF_NAME}" dist/catalog.json --clobber
      - name: Trigger website rebuild (optional)
        env:
          HOOK: ${{ secrets.WEBSITE_DEPLOY_HOOK }}
        if: ${{ env.HOOK != '' }}
        run: curl -fsS -X POST "$HOOK" > /dev/null && echo "Website rebuild triggered"
