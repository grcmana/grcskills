name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate skills and check references are in sync
        run: python3 scripts/sync_references.py --check
      - name: Validate catalogue metadata
        run: python3 scripts/build_catalog.py
