name: New skill proposal
description: Propose a new GRC skill
title: "[new skill] "
labels: [new-skill]
body:
  - type: textarea
    id: job
    attributes:
      label: Job to be done
      description: What GRC task does it automate, and who does it (GRC engineer, accidental owner, auditor)?
    validations: { required: true }
  - type: input
    id: frameworks
    attributes:
      label: Frameworks or regulations
  - type: textarea
    id: io
    attributes:
      label: Inputs and outputs
      description: What it reads, and what it produces under grc/.
  - type: textarea
    id: overlap
    attributes:
      label: Why an existing skill doesn't cover it
  - type: dropdown
    id: build
    attributes:
      label: Willing to build it?
      options: ["Yes", "With help", "No"]
